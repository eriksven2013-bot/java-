name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show repo files
        run: ls -la
      - name: Unzip project
        run: |
          Z=$(ls *.zip 2>/dev/null | head -1)
          if [ -z "$Z" ]; then echo "NO ZIP FILE FOUND IN REPO TOP LEVEL"; exit 1; fi
          echo "Using: $Z"
          unzip -q "$Z"
          test -d story-engine || { echo "NO story-engine FOLDER INSIDE ZIP"; ls; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - run: gradle build
        working-directory: story-engine
      - uses: actions/upload-artifact@v4
        with:
          name: storyengine-jar
          path: story-engine/build/libs/*.jar
