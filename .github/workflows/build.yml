name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show repo files
        run: find . -not -path './.git/*' | head -60
      - name: Find project folder
        run: |
          F=$(find . -name build.gradle -not -path './.git/*' | head -1)
          if [ -z "$F" ]; then echo "NO build.gradle FOUND IN REPO"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$F")" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - run: gradle build
        working-directory: ${{ env.PROJECT_DIR }}
      - uses: actions/upload-artifact@v4
        with:
          name: storyengine-jar
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
